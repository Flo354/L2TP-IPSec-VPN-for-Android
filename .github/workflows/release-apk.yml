name: Release APK

# Every push to master builds a release APK, signs it and publishes it as a GitHub release tagged
# build-<run number>. The newest build is always one fixed link away:
#
#   https://github.com/<owner>/<repo>/releases/latest/download/L2TP-IPSec-VPN.apk
#
# SECURITY. This workflow holds a signing key, which makes it a target for poisoned pipeline
# execution: getting the pipeline to run code of the attacker's choosing while the key is within
# reach. docs/release-pipeline.md has the threat model and the repository settings this file relies
# on. These rules are what keep the key safe; a change that breaks one of them reopens the hole:
#
#   1. The key never shares a job with code from the repository. `build` runs Gradle - the build
#      scripts, the wrapper, the tests, every plugin and dependency - with no secret and a read-only
#      token. `sign` holds the key and runs nothing from the repository: no checkout, no Gradle,
#      only the runner image's zipalign and apksigner and the gh CLI, on an APK handled as data.
#   2. The key lives in the `release` environment, which only master may deploy to - never in
#      repository secrets, which any workflow on any branch can read.
#   3. Only push and workflow_dispatch trigger it. Never pull_request_target or workflow_run: both
#      run with secrets on behalf of code nobody with write access has reviewed.
#   4. No ${{ }} expression inside a run: script. Values reach the shell as environment variables,
#      so a crafted commit message or branch name stays data.
#   5. Every action is pinned to a full commit SHA, so a moved or hijacked tag changes nothing.
#   6. No cache. A cache entry outlives the run that wrote it, and `sign` must never restore
#      anything another job could have written.
#   7. GitHub-hosted runners only: a fresh VM per job is what stops `build` leaving something
#      behind for `sign`.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

# Two quick pushes must not race each other to the "latest" release.
concurrency:
  group: release-apk
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and build (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gradle-wrapper.jar is a binary no diff review can read, and the first thing ./gradlew runs.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25' # what gradle/gradle-daemon-jvm.properties asks for

      - name: Run the unit tests and build the unsigned release APK
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and publish (no repository code)
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the tag and the release
    env:
      APK_NAME: L2TP-IPSec-VPN.apk
      TAG: build-${{ github.run_number }}
    steps:
      # Deliberately no checkout: nothing from the repository runs in the job that holds the key.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: ${{ runner.temp }}/unsigned

      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the 'release' environment:$missing. Nothing is published. See docs/release-pipeline.md."
            exit 1
          fi

          # The runner image's newest stable build tools (sort -V would rank 37.0.0-rc2 above 37.0.0),
          # never anything from the repository.
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | grep -E '/[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          "$tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"

          umask 077
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # The password is read from the environment, never put on a command line where any process
          # on the machine could list it. With PKCS12 the key password is the store password.
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/aligned.apk"

      - name: Verify the signature
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | grep -E '/[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          "$tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/$APK_NAME" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apksigner.txt"
          # apksigner labels the signer differently by scheme ("V3.0 Signer:", "Signer #1"), so match
          # only the part that does not change.
          digest=$(grep -m 1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' "$RUNNER_TEMP/apksigner.txt" | cut -d ' ' -f 4 || true)
          if [ -z "$digest" ]; then
            echo "::error::apksigner printed no certificate SHA-256 digest"
            exit 1
          fi
          echo "$digest" > "$RUNNER_TEMP/cert-sha256.txt"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          message=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message')
          {
            printf '%s\n\n' "${message%%$'\n'*}"
            printf 'Built from %s.\n\n' "$GITHUB_SHA"
            printf 'Signing certificate SHA-256: `%s`\n' "$(cat "$RUNNER_TEMP/cert-sha256.txt")"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run of the same workflow run: replace the asset rather than fail on the tag.
            gh release upload "$TAG" "$RUNNER_TEMP/$APK_NAME" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$APK_NAME" --target "$GITHUB_SHA" \
              --title "Build $GITHUB_RUN_NUMBER" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
