# /etc/strongswan.conf - lab overrides for a containerised charon.
#
# Order matters: strongswan.conf uses "last definition wins", and the
# Debian snippets under /etc/strongswan.d/ re-declare charon{} defaults,
# so our overrides are repeated AFTER the include.

charon {
    load_modular = yes
    plugins {
        include strongswan.d/charon/*.conf
    }
}

include strongswan.d/*.conf

# --------------------------------------------------------------------------
# Lab overrides (must come last so they win over the Debian snippets)
# --------------------------------------------------------------------------
charon {
    # In a container we must not let charon touch the routing table or add
    # source routes / virtual IPs - it breaks docker's own networking and is
    # useless for transport mode anyway.
    install_routes = no
    install_virtual_ip = no

    # Do not fiddle with the (namespaced) host sysctls; entrypoint.sh does it.
    # Keep retransmits short so a broken client fails fast in tests.
    retransmit_timeout = 2
    retransmit_tries = 3
    retransmit_base = 1.4

    close_ike_on_child_failure = no

    # A hand-written client under development leaves a LOT of half-open IKE
    # SAs behind (aborted handshakes, wrong HASH, crashed test runs). With the
    # defaults charon starts SILENTLY DROPPING main-mode message 1 from that
    # source IP after a handful of them - it logs
    #   "ignoring IKE_SA setup from x.x.x.x, per-IP half-open IKE_SA limit ..."
    # and from the client side it looks exactly like "the server is dead".
    # NOTE: 0 does NOT mean "unlimited" here - a large number is required.
    block_threshold      = 200
    init_limit_half_open = 200
    init_limit_job_load  = 200
    half_open_timeout    = 10

    # Plugins that are useless here and only produce log noise / intercept
    # multicast traffic on the docker bridge.
    plugins {
        forecast     { load = no }
        farp         { load = no }
        ha           { load = no }
        dhcp         { load = no }
        lookip       { load = no }
        led          { load = no }
        certexpire   { load = no }
        error-notify { load = no }
        addrblock    { load = no }
        connmark     { load = no }
        eap-radius   { load = no }
        eap-tnc      { load = no }
        tnc-tnccs    { load = no }
        resolve      { load = no }
        attr-sql     { load = no }
    }

    filelog {
        lab {
            path = /var/log/charon.log
            time_format = %b %e %T
            ike_name = yes
            append = no
            flush_line = yes
            # Loud where it matters for a client implementer, silent
            # elsewhere. These act as a filter on top of charondebug.
            default = 1
            ike     = 3
            cfg     = 2
            knl     = 2
            net     = 2
            esp     = 2
            enc     = 1
            dmn     = 2
            mgr     = 0
            job     = -1
            lib     = 0
        }
        stderr {
            default = 0
            dmn     = 1
            ike_name = yes
        }
    }

    syslog {
        daemon {
            default = -1
        }
        auth {
            default = -1
        }
    }
}
