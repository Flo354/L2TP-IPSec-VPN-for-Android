# /etc/ipsec.conf - strongSwan IPsec configuration (lab L2TP/IPsec PSK server)
#
# Deliberately narrow: exactly one proposal in each phase so that a
# from-scratch client can be validated against a single known-good transform
# set (this is what an Orange Livebox Pro offers).

config setup
    charondebug="ike 3, knl 2, cfg 2, net 2, esp 2, dmn 2, mgr 2"
    uniqueids=no

conn %default
    keyexchange=ikev1
    authby=secret
    keyingtries=1
    ikelifetime=8h
    lifetime=1h

conn L2TP-PSK
    keyexchange=ikev1
    authby=secret
    type=transport
    left=%any
    leftprotoport=17/1701
    right=%any
    rightprotoport=17/%any
    # Phase 1: AES-256 / SHA-256 / MODP-2048 (DH group 14), main mode only.
    ike=aes256-sha256-modp2048!
    # Phase 2: ESP AES-256 / HMAC-SHA-256, transport mode, no PFS.
    esp=aes256-sha256!
    # Always wrap ESP in UDP/4500: the Android client can never send
    # IP-protocol-50 ESP, so it always claims to be behind a NAT.
    forceencaps=yes
    rekey=no
    dpddelay=30
    dpdaction=clear
    auto=add
