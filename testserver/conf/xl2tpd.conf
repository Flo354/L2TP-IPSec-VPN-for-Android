; /etc/xl2tpd/xl2tpd.conf - LNS for the lab
[global]
port = 1701
access control = no
; the kernel pppol2tp module is not always present in a container; the
; userspace path always works and is what we want to observe anyway.
force userspace = yes
ipsec saref = no
debug avp = yes
debug network = yes
debug packet = no
debug state = yes
debug tunnel = yes

[lns default]
; PPP address plan
ip range = 10.10.10.100-10.10.10.199
local ip = 10.10.10.1
; Do NOT force a single auth protocol here - pppd must be free to offer
; MS-CHAPv2, then CHAP-MD5, then PAP so every client path can be exercised.
require authentication = yes
require chap = no
refuse chap = no
require pap = no
refuse pap = no
unix authentication = no
name = L2TPServer
hostname = L2TPServer
ppp debug = yes
pppoptfile = /etc/ppp/options.xl2tpd
length bit = yes
flow bit = no
