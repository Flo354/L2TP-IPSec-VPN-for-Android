# Client-side strongSwan config used only by verify.sh (runs in a throw-away
# sibling container). @@SERVER@@ is substituted by run-client.sh.
config setup
    charondebug="ike 3, knl 2, cfg 2, net 2, esp 2, dmn 2"
    uniqueids=no

conn L2TP-PSK-client
    keyexchange=ikev1
    authby=secret
    type=transport
    left=%defaultroute
    leftprotoport=17/%any
    right=@@SERVER@@
    rightprotoport=17/1701
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256!
    forceencaps=yes
    rekey=no
    auto=add
