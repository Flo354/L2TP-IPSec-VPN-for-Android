; xl2tpd LAC config for verify.sh - @@SERVER@@ substituted at runtime
[global]
port = 1701
access control = no
force userspace = yes
debug avp = yes
debug network = yes
debug state = yes
debug tunnel = yes

[lac lab]
lns = @@SERVER@@
ppp debug = yes
pppoptfile = /etc/ppp/options.l2tpd.client
length bit = yes
require authentication = no
require pap = no
require chap = no
refuse pap = no
refuse chap = no
autodial = no
redial = no
